name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Five gates stand up embedded Postgres on fixed ports — 54329 seeds-rls,
# 54330 hive-state-rls, 54331 share-visibility, 54332 private-hives-seal,
# 55433 nectar-ledger (its verify/ suite predates the gate and kept its port;
# the mutation harness's derived copy uses 55500, manual only).
# The distinct ports are NOT for this workflow: run-checks.mjs runs gates
# sequentially (`await run(gate)`), so no two hold a port at once inside one
# `npm test`, and each GitHub-hosted job is a new VM, so two runs cannot
# collide either. The ports matter LOCALLY — two worktrees running `npm test`
# at the same time DO collide, and a sixth PG gate must take 54333 rather
# than reuse one of these. Enumerated here because the old pointer
# (`check-*-rls.mjs`) finds only two of the five.
#
# This block is a CI-minutes optimisation, nothing more. cancel-in-progress is
# scoped OFF for main: back-to-back merges would otherwise cancel the earlier
# run and leave a commit on main with no completed verdict.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No SKIP_PG_GATES here on purpose — the whole point of this workflow
      # is to run the four Postgres RLS suites that only ever ran when a
      # human remembered to `npm test` locally.
      - run: npm test
